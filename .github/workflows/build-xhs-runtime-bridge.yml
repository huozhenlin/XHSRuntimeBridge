name: Build XHSRuntimeBridge

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-xhs-runtime-bridge.yml"
      - "ios/XHSRuntimeBridge/**"

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$GITHUB_WORKSPACE/.theos-sdk"
          brew install ldid xz

      - name: Build dylib
        working-directory: ios/XHSRuntimeBridge
        env:
          THEOS: ${{ github.workspace }}/.theos-sdk
        shell: bash
        run: |
          set +e
          make clean 2>&1 | tee build.log
          make FINALPACKAGE=1 2>&1 | tee -a build.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            MESSAGE="$(tail -n 80 build.log | sed 's/%/%25/g; s/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            echo "::error title=XHSRuntimeBridge build failed::$MESSAGE"
            exit "$STATUS"
          fi
          find .theos -name 'XHSRuntimeBridge.dylib' -print

      - name: Collect artifact
        run: |
          mkdir -p artifacts
          DYLIB="$(find ios/XHSRuntimeBridge/.theos -type f -name 'XHSRuntimeBridge.dylib' | head -n 1)"
          test -n "$DYLIB"
          cp "$DYLIB" artifacts/XHSRuntimeBridge.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: XHSRuntimeBridge
          path: artifacts/XHSRuntimeBridge.dylib
          if-no-files-found: error
