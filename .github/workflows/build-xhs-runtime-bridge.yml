name: Build XHSRuntimeBridge

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-xhs-runtime-bridge.yml"
      - "ios/XHSRuntimeBridge/**"
      - "ios/NoteDetailMonitor/**"

jobs:
  build:
    # macos-14 is currently mapped to an unavailable arm64 configuration for
    # this repository. macos-13 provides the Intel macOS image required by
    # Theos and avoids the unsupported runner configuration.
    runs-on: macos-13
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$GITHUB_WORKSPACE/.theos-sdk"
          brew install ldid xz

      - name: Build dylib
        working-directory: ios/XHSRuntimeBridge
        env:
          THEOS: ${{ github.workspace }}/.theos-sdk
        shell: bash
        run: |
          set +e
          make clean 2>&1 | tee build.log
          make FINALPACKAGE=1 2>&1 | tee -a build.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            MESSAGE="$(tail -n 80 build.log | sed 's/%/%25/g; s/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            echo "::error title=XHSRuntimeBridge build failed::$MESSAGE"
            exit "$STATUS"
          fi
          find .theos -name 'XHSRuntimeBridge.dylib' -print

      - name: Build NoteDetailMonitor
        working-directory: ios/NoteDetailMonitor
        env:
          THEOS: ${{ github.workspace }}/.theos-sdk
        shell: bash
        run: |
          set +e
          make clean 2>&1 | tee build.log
          make FINALPACKAGE=1 package 2>&1 | tee -a build.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            MESSAGE="$(tail -n 80 build.log | sed 's/%/%25/g; s/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            echo "::error title=NoteDetailMonitor build failed::$MESSAGE"
            exit "$STATUS"
          fi
          find .theos -name 'NoteDetailMonitor.dylib' -print

      - name: Collect artifact
        run: |
          mkdir -p artifacts
          DYLIB="$(find ios/XHSRuntimeBridge/.theos -type f -name 'XHSRuntimeBridge.dylib' | head -n 1)"
          test -n "$DYLIB"
          cp "$DYLIB" artifacts/XHSRuntimeBridge.dylib
          FRAMEWORK="artifacts/XHSRuntimeBridge.framework"
          mkdir -p "$FRAMEWORK"
          cp "$DYLIB" "$FRAMEWORK/XHSRuntimeBridge"
          cat > "$FRAMEWORK/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>XHSRuntimeBridge</string>
            <key>CFBundleIdentifier</key><string>com.huozhenlin.XHSRuntimeBridge</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleVersion</key><string>${{ github.sha }}</string>
            <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
            <key>MinimumOSVersion</key><string>15.0</string>
          </dict>
          </plist>
          EOF
          (
            cd artifacts
            ditto -c -k --sequesterRsrc --keepParent \
              XHSRuntimeBridge.framework \
              XHSRuntimeBridge.framework.zip
          )
          MONITOR_DYLIB="$(find ios/NoteDetailMonitor/.theos -type f -name 'NoteDetailMonitor.dylib' | head -n 1)"
          test -n "$MONITOR_DYLIB"
          cp "$MONITOR_DYLIB" artifacts/NoteDetailMonitor.dylib
          MONITOR_FRAMEWORK="artifacts/NoteDetailMonitor.framework"
          mkdir -p "$MONITOR_FRAMEWORK"
          cp "$MONITOR_DYLIB" "$MONITOR_FRAMEWORK/NoteDetailMonitor"
          cat > "$MONITOR_FRAMEWORK/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>NoteDetailMonitor</string>
            <key>CFBundleIdentifier</key><string>com.huozhenlin.NoteDetailMonitor</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleVersion</key><string>${{ github.sha }}</string>
            <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
            <key>MinimumOSVersion</key><string>15.0</string>
          </dict>
          </plist>
          EOF
          (
            cd artifacts
            ditto -c -k --sequesterRsrc --keepParent \
              NoteDetailMonitor.framework \
              NoteDetailMonitor.framework.zip
          )

      - uses: actions/upload-artifact@v4
        with:
          name: XHSRuntimeBridge
          path: artifacts/
          if-no-files-found: error
